
<!--  Profile Page
Design a personal profile page.
Requirements:

Use the <img> tag to display your profile picture.
Add a brief description about yourself in a paragraph below the image.
Use the alt attribute to describe the image.
Set the image width to 200px for consistency.

-->

<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>
<body>

    <h1>My Profile</h1>

    <img src="profile.jpg"
         alt="My Profile Picture"
         width="200px">

    <p>Hello! My name is Rahul.
    I am a student and I love learning HTML
    and creating websites.</p>

</body>
</html>
