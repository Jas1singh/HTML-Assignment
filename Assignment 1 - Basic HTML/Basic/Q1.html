
<!-- Assignment 1: Article Layout
Create an HTML page to display a news article.
Requirements:

Use <h1> for the main article title.
Use <h2> for subheadings.
Write at least two paragraphs about the article.
Include a "Read more" link using the <a> tag that points to a related webpage.
-->

<!DOCTYPE html>
<html>
<head>
    <title>News Article</title>
</head>
<body>

    <h1>Importance of Education</h1>

    <h2>Introduction</h2>
    <p>Education plays an important role in everyone's life.
    It helps people gain knowledge and develop skills.</p>

    <h2>Benefits of Education</h2>
    <p>Education improves confidence, creates career opportunities
    and helps people make better decisions in life.</p>

    <a href="https://www.unesco.org/">Read More</a>

</body>
</html>
