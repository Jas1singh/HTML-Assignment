
<!--
Scenario: A teacher wants to display a class's grades in a tabular format. The table should include:

Student ID
Name
Subject
Marks
Assignment: Create an HTML table with 5 rows of data. Add a heading row with proper column names.
-->


<!DOCTYPE html>
<html>
<head>
    <title>Class Grades</title>
</head>
<body>

    <h1>Class Grades Table</h1>

    <table border="1">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>Maths</td>
            <td>85</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Amit</td>
            <td>Science</td>
            <td>90</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Priya</td>
            <td>English</td>
            <td>88</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Neha</td>
            <td>Computer</td>
            <td>95</td>
        </tr>

        <tr>
            <td>5</td>
            <td>Rohan</td>
            <td>Hindi</td>
            <td>80</td>
        </tr>
    </table>

</body>
</html>
