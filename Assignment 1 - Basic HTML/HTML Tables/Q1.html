<!--
Objective: Create a simple HTML table to display a list of student names and their marks.

Requirements:

Create a table with three columns: Roll Number, Student Name, and Marks.
Add at least five rows of data.
Use the <table>, <tr>, <th>, and <td> tags.
-->
    

<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>
</head>
<body>

    <h1>Student Marks Table</h1>

    <table border="1">
        <tr>
            <th>Roll Number</th>
            <th>Student Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>85</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Amit</td>
            <td>90</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Priya</td>
            <td>88</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Neha</td>
            <td>92</td>
        </tr>

        <tr>
            <td>105</td>
            <td>Rohan</td>
            <td>78</td>
        </tr>
    </table>

</body>
</html>
