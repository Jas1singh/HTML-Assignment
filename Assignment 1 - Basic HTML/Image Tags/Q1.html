
<!-- 
  Image with Links
Create an HTML page where clicking on an image redirects the user to another website or page.
Use the <a> tag to wrap the <img> tag.
Add multiple linked images with different destinations.
-->

<!DOCTYPE html>
<html>
<head>
    <title>Image Links</title>
</head>
<body>

    <h1>Click on Images to Visit Websites</h1>

    <a href="https://www.google.com/">
        <img src="google.jpg" alt="Google Website" width="200">
    </a>

    <a href="https://www.youtube.com/">
        <img src="youtube.jpg" alt="YouTube Website" width="200">
    </a>

    <a href="https://www.wikipedia.org/">
        <img src="wikipedia.jpg" alt="Wikipedia Website" width="200">
    </a>

</body>
</html>
