
<!--
Create an ordered list of tasks for your daily routine:

Each task should include a title and a description (use <li> and <span> or <p>).
Use custom numbering for the tasks (e.g., start from 101 instead of 1 using the start attribute of <ol>).
-->

<!DOCTYPE html>
<html>
<head>
    <title>Daily Routine</title>
</head>
<body>

    <h1>My Daily Routine</h1>

    <ol start="101">
        <li>
            <span>Wake Up</span>
            <p>I wake up early in the morning.</p>
        </li>

        <li>
            <span>Exercise</span>
            <p>I exercise to stay healthy.</p>
        </li>

        <li>
            <span>Study</span>
            <p>I study and complete my homework.</p>
        </li>

        <li>
            <span>Lunch</span>
            <p>I eat lunch in the afternoon.</p>
        </li>

        <li>
            <span>Sleep</span>
            <p>I go to bed at night.</p>
        </li>
    </ol>

</body>
</html>
